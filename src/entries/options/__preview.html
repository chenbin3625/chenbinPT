<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>chenbinPT (preview)</title>
    <link href="style.css" rel="stylesheet" />
    <script>
      // 仅用于本地浏览器预览的 chrome.* 最小 mock，不提交
      (function () {
        const store = {};
        const listeners = () => ({ addListener() {}, removeListener() {}, hasListener: () => false });
        const storageArea = {
          get: (keys, cb) => {
            const r = {};
            (Array.isArray(keys) ? keys : keys == null ? Object.keys(store) : [keys]).forEach((k) => {
              if (k in store) r[k] = store[k];
            });
            return cb ? cb(r) : Promise.resolve(r);
          },
          set: (obj, cb) => (Object.assign(store, obj), cb ? cb() : Promise.resolve()),
          remove: (k, cb) => (cb ? cb() : Promise.resolve()),
          onChanged: listeners(),
        };
        window.chrome = {
          storage: { local: storageArea, session: storageArea, sync: storageArea, onChanged: listeners() },
          runtime: {
            id: "preview",
            // F1-05：扩展的持久化层与 runtime store 都用「location.href 是否以 runtime.getURL("") 开头」
            // 来判断当前文档是不是扩展页（见 extends/pinia/webExtPersistence.ts 的
            // isContentScriptStorageContext 与 stores/runtime.ts 的 isHostPageStorage）。
            // 旧 mock 返回 `p` 本身（getURL("") === ""），判定落到「http 页面 ⇒ 内容脚本」分支：
            // 上面这套 storage mock 一次都不会被调用，预览页的设置刷新即丢、也永远看不到水合后的界面。
            // 这里让 getURL 返回「预览页自己的 origin 前缀」，使判定为「扩展页」，
            // 从而让 mock storage 真正参与读写（仅本地预览用途，不影响扩展运行时）。
            getURL: (p) => new URL(String(p ?? ""), `${location.origin}/`).href,
            sendMessage: (_message, callback) => {
              const response = {
                err: {
                  name: "PreviewBackgroundUnavailableError",
                  message: "Background services are unavailable in the options preview.",
                  stack: "",
                },
              };
              if (typeof callback === "function") {
                queueMicrotask(() => callback(response));
                return;
              }
              return Promise.resolve(response);
            },
            onMessage: listeners(),
            connect: () => ({ onMessage: listeners(), onDisconnect: listeners(), postMessage() {} }),
            getManifest: () => ({ version: "0.0.0" }),
          },
          i18n: { getUILanguage: () => "zh-CN", getMessage: (k) => k },
          permissions: { contains: () => Promise.resolve(false), request: () => Promise.resolve(false) },
        };
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
  <script src="./main.ts" type="module"></script>
</html>
