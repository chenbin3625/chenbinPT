name: Build Action Release

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.zip_chrome.outputs.extensionVersion }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '1' || '0' }} # 根据事件类型动态设置 fetch-depth

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: vue-tsc check
        run: npm run check

      - name: ESLint
        run: npm run lint

      # 迁移验收（静态扫描，12 项）：禁止残留 <Ptd* 兼容组件 / Vuetify-only prop /
      # 原生 confirm|prompt|alert / 原生表格控件、空 <style>、未定义的自有 class、
      # 兼容层死代码、CSS 提权（!important / body 前缀 / :where()）、.ant-* 覆写规模、
      # 手写 Vuetify 工具类层、MDI webfont 注入。
      # 该脚本此前已存在于仓库，但没有被任何 npm script / CI / husky 引用，
      # 因此「迁移完成」的判据长期未达成且在 CI 中不可见（见审查报告 Q-2）。
      - name: antd migration acceptance
        run: npm run check:antd

      # 供应链：workflow 里持有商店发布密钥，action 不能停在可变 tag/分支上
      # （见审查报告 Q-4；脚本会在有 uses 未固定到 40 位 commit SHA 时判失败）
      - name: action pins
        run: npm run check:pins

      - name: Unit tests
        run: npm test

      - name: Build Output
        run: |
          npm run build:dist
          npm run build:dist-firefox

      # 断言「关键产物齐全 + 体积未回归」。
      # 缺产物（例如 options 页面/cs-app.js 没生成）会产生「装得上但点开空白」的半成品包；
      # 体积预算则用来守住静态资产瘦身的成果（图标 4.5MB→1.1MB、MDI 820KB→21KB）。
      - name: Check bundle completeness & budget
        run: |
          node scripts/check-bundle-budget.mjs
          node scripts/check-bundle-budget.mjs --target=firefox

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Extension browser smoke E2E
        run: xvfb-run -a npm run test:e2e

      - name: Upload Chrome Built to action
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-dist-chrome
          path: dist-chrome

      - name: Upload Firefox Built to action
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-dist-firefox
          path: dist-firefox

      - run: mkdir -p build-zip

      - id: zip_chrome
        name: Build Zip For Chrome
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@7817580282fd8657b8f482854e7adc54bb7991d6 # v1
        with:
          extensionDir: "dist-chrome"
          zipFilePath: "build/extension-chrome.zip"

      - id: zip_firefox
        name: Build Zip For Firefox
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@7817580282fd8657b8f482854e7adc54bb7991d6 # v1
        with:
          extensionDir: "dist-firefox"
          zipFilePath: "build/extension-firefox.zip"

      - name: Upload Built Zip to action
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-zip-${{ steps.zip_chrome.outputs.extensionVersion }}
          path: build/*.zip

      - name: Build Self-Sign Crx For Chrome
        # 本地等价命令：npm run pack:crx（scripts/pack-crx.mjs 自实现 CRX3 并自校验签名；
        # 对同一 zip + 同一私钥，其输出与本步骤逐字节一致）
        uses: cardinalby/webext-buildtools-chrome-crx-action@2d3b64d6a82a252eac2dc82ee90760c5217024fa # v2
        env:
          CHROME_SELF_SIGN_CRX_PRIVATE_KEY: ${{ secrets.CHROME_SELF_SIGN_CRX_PRIVATE_KEY }}
        if: ${{ env.CHROME_SELF_SIGN_CRX_PRIVATE_KEY != ''  }}
        with:
          zipFilePath: "build/extension-chrome.zip"
          crxFilePath: "build/extension.crx"
          privateKey: "${{ secrets.CHROME_SELF_SIGN_CRX_PRIVATE_KEY }}"

      - name: Upload Built Crx to action
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: build/extension.crx
          name: build-crx-${{ steps.zip_chrome.outputs.extensionVersion }}

      - name: Upload build folder to Telegram Channel
        env:
          BUILD_VERSION: ${{ steps.zip_chrome.outputs.extensionVersion }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: npm run action:upload_telegram
        continue-on-error: true
